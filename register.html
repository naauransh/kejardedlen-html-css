<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar - KejarDedlen</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <!-- Logo -->
  <a href="landing-page.html" class="brand">
    <span class="brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d4d85"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5 13 10 18 19 7"/>
      </svg>
      <i class="brand-dot"></i>
    </span>
    <span class="brand-name">KejarDedlen</span>
  </a>
 
  <main class="auth-card">
 
    <!-- Panel kiri -->
    <section class="auth-side">
      <div>
        <p class="side-eyebrow">Kejar deadline-mu</p>
        <h2 class="side-title">Mulai lebih awal. Selesai duluan.</h2>
        <p class="side-text">Satu tempat untuk tugas pribadi dan kerja kelompokmu.</p>
      </div>
 
      <div class="steps" aria-hidden="true">
        <span class="step"></span>
        <span class="line"></span>
        <span class="step"></span>
        <span class="line"></span>
        <span class="step"></span>
      </div>
    </section>
 
    <!-- Panel kanan (form) -->
    <section class="auth-form">
      <a href="landing-page.html" class="back-link">&larr; Kembali ke beranda</a>
 
      <h1>Daftar</h1>
      <p class="subtitle">Buat akun dan mulai mengejar.</p>
 
      <form action="#" method="post">
        <div class="field">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" autocomplete="name" required>
        </div>
 
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
 
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
 
        <div class="field">
          <label for="konfirmasi">Konfirmasi password</label>
          <input type="password" id="konfirmasi" name="konfirmasi" autocomplete="new-password" required>
        </div>
 
        <button type="submit" class="btn-submit">Daftar</button>
      </form>
 
      <p class="switch">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </section>
 
  </main>
 
</body>
</html>
