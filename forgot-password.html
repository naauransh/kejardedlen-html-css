<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa Password - KejarDedlen</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
 
  <!-- Logo -->
  <a href="landing-page.html" class="brand">
    <span class="brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b4f86"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5 13 10 18 19 7"/>
      </svg>
      <i class="brand-dot"></i>
    </span>
    <span class="brand-name">KejarDedlen</span>
  </a>
 
  <main class="auth-card auth-card-forgot">
 
    <!-- Panel kiri -->
    <section class="auth-side">
      <div>
        <p class="side-eyebrow">Kejar deadline-mu</p>
        <h2 class="side-title">Kami bantu kamu kembali.</h2>
        <p class="side-text">Satu tempat untuk tugas pribadi dan kerja kelompokmu.</p>
      </div>
 
      <div class="steps" aria-hidden="true">
        <span class="step"></span>
        <span class="line"></span>
        <span class="step"></span>
        <span class="line"></span>
        <span class="step"></span>
      </div>
    </section>
 
    <!-- Panel kanan (form) -->
    <section class="auth-form">
      <a href="landing-page.html" class="back-link">&larr; Kembali ke beranda</a>
 
      <h1>Lupa password</h1>
      <p class="subtitle">Masukkan email yang terdaftar.</p>
 
      <form action="#" method="post">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
 
        <button type="submit" class="btn-submit">Kirim link reset</button>
      </form>
 
      <a href="login.html" class="back-login">Kembali ke Login</a>
    </section>
 
  </main>
 
</body>
</html>
